<script>
(function(){
  if(!new URLSearchParams(location.search).has('embed')) return;
  document.documentElement.classList.add('is-embed');
  var st=document.createElement('style');
  st.textContent='::-webkit-scrollbar{width:0;height:0}html{scrollbar-width:none}';
  document.head.appendChild(st);
  var DUR=18000,HOLD=1000,phase='down',anchor=null,holdUntil=0;
  function tick(){
    var now=performance.now();
    var max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
    if(max<8) return;
    if(anchor===null) anchor=now;
    if(now<holdUntil) return;
    var t=Math.min((now-anchor)/DUR,1);
    var p=phase==='down'?t:1-t;
    scrollTo(0,p*max);
    if(t>=1){phase=phase==='down'?'up':'down';anchor=now;holdUntil=now+HOLD;}
  }
  addEventListener('load',function(){setTimeout(function(){setInterval(tick,16)},1600)});
})();
</script>
