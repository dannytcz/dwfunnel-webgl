    .gpu { will-change: transform, opacity; transform: translateZ(0); backface-visibility: hidden; }

    .nav-link {
      position: relative;
      transition: opacity 220ms ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      right: 100%;
      bottom: -5px;
      height: 1px;
      background: rgba(255,255,255,.72);
      transition: right 240ms ease;

    .nav-link:hover { opacity: 1 !important; }

    .scene-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: rgba(255,255,255,.08);

      transform-style: preserve-3d;
      transition: box-shadow 280ms ease;

    .scene-card:hover {
      box-shadow: 0 22px 70px rgba(0,0,0,.34), inset 0 0 0 1px rgba(255,255,255,.2);
    }
    .scene-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.02);
      transition: transform 650ms cubic-bezier(.2,.7,.2,1);
    }
    .scene-card:hover img { transform: scale(1.08); }

    .card-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.18) 60%, transparent 100%);
      pointer-events: none;
    }

    .card-glass {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 62px;
      display: flex;
      align-items: center;
      padding: 13px 15px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      background: linear-gradient(to top, rgba(10,6,8,.26), rgba(10,6,8,.04));
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .play-button {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.8);
      background: rgba(255,255,255,.96);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      transition: transform 250ms ease, background 250ms ease;
      box-shadow: 0 7px 22px rgba(0,0,0,.18);
    }
    .scene-card:hover .play-button { transform: scale(1.08); background: #fff; }

    .curtain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transform-origin: center center;
