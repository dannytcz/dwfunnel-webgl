<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="CerebralKinetics, adaptive systems, advanced bionics, and cognitive AI. A Built by DW Funnel." />
  <title>CerebralKinetics · Adaptive Systems</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      font-family: "Inter", sans-serif;
      color: #000;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    html,
    body {
      min-height: 100vh;
      background: #fff;
    }

    body {
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
    }

    .hero {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: #fff;
    }

    .navbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px;
      pointer-events: none;
    }

    .navbar > * {
      pointer-events: auto;
    }

    .nav-left,
    .nav-right,
    .brand,
    .menu-button,
    .nav-tags,
    .adaptive-pill {
      display: flex;
      align-items: center;
    }

    .nav-left {
      gap: 8px;
      min-width: 0;
    }

    .brand {
      gap: 9px;
      margin-right: 2px;
      text-decoration: none;
      color: #000;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 28px;
    }

    .brand-mark svg {
      display: block;
      width: 24px;
      height: 24px;
    }

    .brand-name {
      display: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .menu-button {
      gap: 8px;
      height: 36px;
      padding: 4px 12px 4px 4px;
      border-radius: 999px;
      background: #000;
      color: #fff;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .menu-button:hover {
      background: #151515;
      transform: translateY(-1px);
    }

    .menu-button:active {
      transform: translateY(0);
    }

    .menu-icon-circle,
    .adaptive-icon-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 28px;
    }

    .menu-icon-circle {
      background: #fff;
      color: #000;
    }

    .menu-button span:last-child {
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
    }

    .nav-tags {
      display: none;
      min-height: 40px;
      padding: 0 16px;
      gap: 16px;
      border-radius: 999px;
      background: #f4f4f6;
      color: rgba(0, 0, 0, 0.56);
      white-space: nowrap;
    }

    .nav-tags span,
    .adaptive-label {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .adaptive-pill {
      min-height: 36px;
      padding: 4px;
      border-radius: 999px;
      background: #f4f4f6;
      color: #000;
      gap: 10px;
    }

    .adaptive-icon-circle {
      background: #000;
      color: #fff;
    }

    .adaptive-label {
      display: none;
      padding-right: 10px;
      white-space: nowrap;
    }

    .dot-grid {
      width: 12px;
      height: 12px;
      display: block;
    }

    .video-stage {
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      width: 80%;
      height: 80%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: #f7f7f7;
    }

    .video-stage video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .footer {
      position: relative;
      z-index: 30;
      width: 100%;
      margin-top: auto;
      padding: 156px 16px 24px;
      background: linear-gradient(
        to top,
        #ffffff 0%,
        rgba(255, 255, 255, 0.8) 50%,
        transparent 100%
      );
    }

    .footer-inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .hero-copy {
      min-width: 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: rgba(0, 0, 0, 0.55);
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #000;
      flex: 0 0 8px;
    }

    .eyebrow-text {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .hero-title {
      margin: 0;
      max-width: 880px;
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 24px;
    }

    .hero-button {
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .hero-button:hover {
      transform: translateY(-1px);
    }

    .hero-button:active {
      transform: translateY(0);
    }

    .hero-button.primary {
      background: #000;
      color: #fff;
    }

    .hero-button.primary:hover {
      background: #1a1a1a;
    }

    .hero-button.secondary {
      background: transparent;
      color: #000;
      border: 1px solid rgba(0, 0, 0, 0.35);
    }

    .hero-button.secondary:hover {
      border-color: rgba(0, 0, 0, 0.65);
      background: rgba(255, 255, 255, 0.35);
    }

    .technology-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-self: flex-start;
    }

    .technology-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: #fff;
      color: rgba(0, 0, 0, 0.72);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    @media (min-width: 768px) {
      .navbar {
        padding: 24px 32px;
      }

      .nav-left {
        gap: 10px;
      }

      .brand {
        gap: 10px;
        margin-right: 8px;
      }

      .brand-name,
      .nav-tags,
      .adaptive-label {
        display: flex;
      }

      .menu-button {
        height: 40px;
        padding: 4px 14px 4px 4px;
      }

      .menu-icon-circle,
      .adaptive-icon-circle {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
      }

      .adaptive-pill {
        min-height: 40px;
      }

      .video-stage {
        width: 100%;
        height: 100%;
      }

      .footer {
        padding: 200px 32px 34px;
      }

      .footer-inner {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
      }

      .hero-title {
        font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      }

      .technology-tags {
        align-self: flex-end;
        justify-content: flex-end;
        padding-bottom: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }

      .menu-button,
      .hero-button {
        transition: none;
      }
    }
  </style>

<script>
(function(){
  if(!new URLSearchParams(location.search).has('embed')) return;
  document.documentElement.classList.add('is-embed');
  var st=document.createElement('style');
  st.textContent='::-webkit-scrollbar{width:0;height:0}html{scrollbar-width:none}';
  document.head.appendChild(st);
  var DUR=14000,HOLD=800,phase='down',anchor=null,holdUntil=0;
  function tick(){
    var now=performance.now();
    var max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
    if(max<8) return;
    if(anchor===null) anchor=now;
    if(now<holdUntil) return;
    var t=Math.min((now-anchor)/DUR,1);
    var p=phase==='down'?t:1-t;
    scrollTo(0,p*max);
    if(t>=1){phase=phase==='down'?'up':'down';anchor=now;holdUntil=now+HOLD;}
  }
  addEventListener('load',function(){setTimeout(function(){setInterval(tick,16)},1200)});
})();
</script>
  <script src="/assets/js/dwf-loader.js?v=6"></script>
</head>

<body>
  <div id="root"></div>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.0",
        "react/": "https://esm.sh/react@19.2.0/",
        "react-dom": "https://esm.sh/react-dom@19.2.0",
        "react-dom/": "https://esm.sh/react-dom@19.2.0/",
        "motion/react": "https://esm.sh/motion@12.23.3/react?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react"
      }
    }
  </script>

  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { motion } from "motion/react";
    import { Plus } from "lucide-react";

    const h = React.createElement;
    const ease = [0.16, 1, 0.3, 1];

    function BrandMark() {
      return h(
        "span",
        { className: "brand-mark", "aria-hidden": "true" },
        h(
          "svg",
          { viewBox: "0 0 28 28", fill: "none", xmlns: "http://www.w3.org/2000/svg" },
          h("rect", {
            x: "4.9",
            y: "8.1",
            width: "17",
            height: "6.7",
            rx: "3.35",
            fill: "black",
            transform: "rotate(-35 4.9 8.1)"
          }),
          h("rect", {
            x: "9.2",
            y: "14.8",
            width: "17",
            height: "6.7",
            rx: "3.35",
            fill: "black",
            transform: "rotate(-35 9.2 14.8)"
          })
        )
      );
    }

    function DotGrid() {
      return h(
        "svg",
        {
          className: "dot-grid",
          viewBox: "0 0 12 12",
          fill: "none",
          xmlns: "http://www.w3.org/2000/svg",
          "aria-hidden": "true"
        },
        h("circle", { cx: "3", cy: "3", r: "1.15", fill: "currentColor" }),
        h("circle", { cx: "9", cy: "3", r: "1.15", fill: "currentColor" }),
        h("circle", { cx: "3", cy: "9", r: "1.15", fill: "currentColor" }),
        h("circle", { cx: "9", cy: "9", r: "1.15", fill: "currentColor" })
      );
    }

    function Navbar() {
      return h(
        motion.nav,
        {
          className: "navbar",
          initial: { y: -16, opacity: 0 },
          animate: { y: 0, opacity: 1 },
          transition: { duration: 0.8, ease },
          "aria-label": "Primary navigation"
        },
        h(
          "div",
          { className: "nav-left" },
          h(
            "a",
            { className: "brand", href: "#", "aria-label": "CerebralKinetics home" },
            h(BrandMark),
            h("span", { className: "brand-name" }, "CerebralKinetics")
          ),
          h(
            "button",
            { className: "menu-button", type: "button", "aria-label": "Open menu" },
            h(
              "span",
              { className: "menu-icon-circle" },
              h(Plus, { size: 12, strokeWidth: 3, "aria-hidden": "true" })
            ),
            h("span", null, "Menu")
          ),
          h(
            "div",
            { className: "nav-tags", "aria-label": "Company focus" },
            h("span", null, "Advanced Bionics"),
            h("span", null, "Cognitive AI")
          )
        ),
        h(
          "div",
          { className: "nav-right" },
          h(
            "div",
            { className: "adaptive-pill" },
            h("button", { className: "adaptive-icon-circle", type: "button", "aria-label": "Open adaptive systems" }, h(DotGrid)),
            h("span", { className: "adaptive-label" }, "Adaptive Systems")
          )
        )
      );
    }

    function BackgroundVideo() {
      return h(
        motion.div,
        {
          className: "video-stage",
          initial: { opacity: 0, scale: 1.05, x: "-50%", y: "-50%" },
          animate: { opacity: 1, scale: 1, x: "-50%", y: "-50%" },
          transition: { duration: 1.8, ease }
        },
        h("video", {
          autoPlay: true,
          muted: true,
          playsInline: true,
          loop: true,
          preload: "auto",
          src: "/assets/demos/cerebralkinetics/hero.mp4",
          "aria-hidden": "true"
        })
      );
    }

    function Footer() {
      return h(
        motion.footer,
        {
          className: "footer",
          initial: { y: 20, opacity: 0 },
          animate: { y: 0, opacity: 1 },
          transition: { delay: 0.5, duration: 1, ease }
        },
        h(
          "div",
          { className: "footer-inner" },
          h(
            "div",
            { className: "hero-copy" },
            h(
              motion.div,
              {
                className: "eyebrow",
                initial: { y: 16, opacity: 0 },
                animate: { y: 0, opacity: 1 },
                transition: { delay: 0.6, duration: 0.8, ease }
              },
              h("span", { className: "eyebrow-dot", "aria-hidden": "true" }),
              h("span", { className: "eyebrow-text" }, "Adaptive systems, 2026")
            ),
            h(
              motion.h1,
              {
                className: "hero-title",
                initial: { y: 20, opacity: 0 },
                animate: { y: 0, opacity: 1 },
                transition: { delay: 0.8, duration: 0.8, ease }
              },
              "Systems That Adapt.",
              h("br"),
              "Worldwide."
            ),
            h(
              motion.div,
              {
                className: "hero-actions",
                initial: { y: 16, opacity: 0 },
                animate: { y: 0, opacity: 1 },
                transition: { delay: 1, duration: 0.8, ease }
              },
              h("button", { className: "hero-button primary", type: "button" }, "See Features"),
              h("button", { className: "hero-button secondary", type: "button" }, "How It Works")
            )
          ),
          h(
            "div",
            { className: "technology-tags", "aria-label": "Technology categories" },
            ["Neuromorphic", "AGI", "Cybernetics"].map((tag) =>
              h("span", { className: "technology-tag", key: tag }, tag)
            )
          )
        )
      );
    }

    function App() {
      return h(
        "main",
        { className: "hero" },
        h(BackgroundVideo),
        h(Navbar),
        h(Footer)
      );
    }

    createRoot(document.getElementById("root")).render(h(App));
  </script>
  <a class="dwf-credit" href="/" style="position:fixed;right:14px;bottom:12px;z-index:9999;font:600 10px/1.2 system-ui,sans-serif;letter-spacing:.05em;color:#fff;text-decoration:none;background:rgba(0,0,0,.45);padding:8px 12px;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:999px">Built by DW Funnel · © 2026</a>
</body>
</html>
