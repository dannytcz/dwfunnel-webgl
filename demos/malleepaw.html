<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Mallee & Paw, considered pet living essentials for Australian homes. A concept build by DW Funnel." />
  <title>Mallee & Paw · Considered Pet Living</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cozyBg: '#F3F5EC',
            cozyGreen: '#17382C',
            cozyGreenHover: '#245643',
            cozyOrange: '#C96A3D',
            cozyOrangeHover: '#AF5732',
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --bg: #F3F5EC;
      --green: #17382C;
      --green-hover: #245643;
      --orange: #C96A3D;
      --orange-hover: #AF5732;
    }

    * { box-sizing: border-box; }

    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% -20%, rgba(255,255,255,.9), transparent 40%);
      color: var(--green);
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .font-serif-display {
      font-family: 'DM Serif Display', serif;
    }


    .brand-lockup {
      line-height: 1;
      color: var(--green);
      min-width: 148px;
    }

    .brand-wordmark {
      font-size: clamp(21px, 1.8vw, 31px);
      letter-spacing: -0.045em;
      white-space: nowrap;
    }

    .brand-wordmark span {
      color: var(--orange);
      font-size: .78em;
      padding: 0 .05em;
    }

    .brand-kicker {
      margin-top: 5px;
      font-size: 7px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: .67;
    }

    @media (min-width: 1024px) {
      .brand-lockup { min-width: 205px; }
      .brand-kicker { font-size: 8px; margin-top: 6px; }
    }

    @keyframes fade-up {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slide-up {
      from { transform: translateY(60px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes slide-in-left {
      from { transform: translateX(-40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slide-in-right {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes text-reveal {
      from {
        transform: translateY(40px) skewY(3deg);
        filter: blur(4px);
        opacity: 0;
      }
      to {
        transform: translateY(0) skewY(0deg);
        filter: blur(0);
        opacity: 1;
      }
    }

    @keyframes word-pop {
      0% {
        transform: translateY(60px) scale(0.7) rotate(-4deg);
        filter: blur(8px);
        opacity: 0;
      }
      65% {
        transform: translateY(-7px) scale(1.035) rotate(1deg);
        filter: blur(0);
        opacity: 1;
      }
      82% {
        transform: translateY(3px) scale(0.99) rotate(-0.35deg);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
        filter: blur(0);
        opacity: 1;
      }
    }

    @keyframes scale-in {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes photo-reveal {
      from { transform: translateY(80px) scale(1.02); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .animate-fade-up { animation: fade-up .8s cubic-bezier(.16,1,.3,1) both; }
    .animate-fade-in { animation: fade-in .6s ease-out both; }
    .animate-slide-up { animation: slide-up .9s cubic-bezier(.16,1,.3,1) both; }
    .animate-slide-in-left { animation: slide-in-left .8s cubic-bezier(.16,1,.3,1) both; }
    .animate-slide-in-right { animation: slide-in-right .8s cubic-bezier(.16,1,.3,1) both; }
    .animate-text-reveal { animation: text-reveal 1s cubic-bezier(.16,1,.3,1) both; }
    .animate-word-pop { animation: word-pop .9s cubic-bezier(.34,1.56,.64,1) both; }
    .animate-scale-in { animation: scale-in .7s cubic-bezier(.16,1,.3,1) both; }
    .animate-photo-reveal { animation: photo-reveal 1.1s cubic-bezier(.16,1,.3,1) both; }

    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-400 { animation-delay: 400ms; }
    .delay-500 { animation-delay: 500ms; }
    .delay-600 { animation-delay: 600ms; }
    .delay-700 { animation-delay: 700ms; }
    .delay-800 { animation-delay: 800ms; }
    .delay-900 { animation-delay: 900ms; }
    .delay-1000 { animation-delay: 1000ms; }
    .delay-1100 { animation-delay: 1100ms; }
    .delay-1200 { animation-delay: 1200ms; }

    .hero-word { display: inline-block; transform-origin: 50% 100%; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .25s ease, background-color .25s ease, color .25s ease;
    }

    .icon-btn:hover { transform: translateY(-2px); }
    .icon-btn:active { transform: translateY(0) scale(.96); }

    .soft-shadow { box-shadow: 0 18px 50px rgba(23, 56, 44, 0.12); }

    .bottom-photo {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .overlay-gradient {
      background: linear-gradient(to top, rgba(10, 34, 26, .64) 0%, rgba(10, 34, 26, .05) 55%, transparent 75%);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-delay: 0ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

<script>
(function(){
  if(!new URLSearchParams(location.search).has('embed')) return;
  document.documentElement.classList.add('is-embed');
  var st=document.createElement('style');
  st.textContent='html.is-embed .dwf-credit{display:none!important}::-webkit-scrollbar{width:0;height:0}html{scrollbar-width:none}';
  document.head.appendChild(st);
  var DUR=14000,HOLD=800,phase='down',anchor=null,holdUntil=0;
  function tick(){
    var now=performance.now();
    var max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
    if(max<8) return;
    if(anchor===null) anchor=now;
    if(now<holdUntil) return;
    var t=Math.min((now-anchor)/DUR,1);
    var p=phase==='down'?t:1-t;
    scrollTo(0,p*max);
    if(t>=1){phase=phase==='down'?'up':'down';anchor=now;holdUntil=now+HOLD;}
  }
  addEventListener('load',function(){setTimeout(function(){setInterval(tick,16)},1200)});
})();
</script>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <script type="text/babel">
    const { useEffect } = React;

    const ASSETS = {
      avatar: '/assets/demos/malleepaw/avatar.webp',
      product: '/assets/demos/malleepaw/product.webp',
      video: '/assets/demos/malleepaw/lifestyle-a.webp',
      bottomLeft: '/assets/demos/malleepaw/lifestyle-c.webp',
      bottomCenter: '/assets/demos/malleepaw/hero.webp',
      bottomRight: '/assets/demos/malleepaw/lifestyle-b.webp',
    };

    function Icon({ name, size = 20, strokeWidth = 2, className = '' }) {
      return <i data-lucide={name} data-width={size} data-height={size} data-stroke-width={strokeWidth} className={className}></i>;
    }

    function Badge({ children }) {
      return (
        <span className="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full border-2 border-[#F3F5EC] bg-cozyOrange text-[10px] font-bold leading-none text-white">
          {children}
        </span>
      );
    }

    function Header() {
      const nav = ['Shop', 'Dogs', 'Cats', 'Our Story', 'Journal'];
      return (
        <header className="relative z-30 flex shrink-0 items-center justify-between px-4 py-3 sm:px-6 md:px-8 lg:px-12 lg:py-4 animate-fade-in delay-100">
          <a href="#" className="shrink-0 animate-fade-in delay-100" aria-label="Mallee & Paw home">
            <div className="brand-lockup">
              <div className="brand-wordmark font-serif-display">Mallee <span>&amp;</span> Paw</div>
              <div className="brand-kicker">Australian Pet Living</div>
            </div>
          </a>

          <nav className="hidden items-center gap-5 md:flex lg:gap-8 animate-fade-up delay-200" aria-label="Primary navigation">
            {nav.map((item, index) => (
              <a
                key={item}
                href="#"
                className={`whitespace-nowrap text-[13px] font-medium transition-colors hover:text-cozyGreen lg:text-sm ${index === 0 ? 'text-gray-900' : 'text-gray-600'}`}
              >
                {item}
              </a>
            ))}
          </nav>

          <div className="flex items-center gap-2 sm:gap-2.5 animate-fade-in delay-300">
            <button className="icon-btn hidden h-10 w-10 rounded-full border border-cozyGreen/20 text-cozyGreen hover:bg-white/70 sm:inline-flex" aria-label="Search">
              <Icon name="search" size={18} strokeWidth={1.8} />
            </button>

            <button className="icon-btn relative h-10 w-10 rounded-full bg-cozyOrange text-white hover:bg-cozyOrangeHover" aria-label="Favorites">
              <Icon name="star" size={17} strokeWidth={2} className="fill-current" />
              <Badge>4</Badge>
            </button>

            <button className="icon-btn relative h-10 w-10 rounded-full border border-cozyGreen/20 text-cozyGreen hover:bg-white/70" aria-label="Shopping cart">
              <Icon name="shopping-cart" size={18} strokeWidth={1.8} />
              <Badge>1</Badge>
            </button>

            <button className="h-10 w-10 overflow-hidden rounded-full ring-1 ring-cozyGreen/10 transition-transform duration-300 hover:scale-105" aria-label="Account">
              <img src={ASSETS.avatar} alt="User avatar" className="h-full w-full object-cover" />
            </button>
          </div>
        </header>
      );
    }

    function ProductCard({ mobile = false }) {
      return (
        <div className={mobile ? 'w-full' : 'w-full'}>
          <div className={`group relative overflow-hidden rounded-2xl soft-shadow ${mobile ? 'aspect-square' : 'aspect-[260/257]'}`}>
            <img src={ASSETS.product} alt="The Mallee Hideaway pet bed" className="h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.035]" />
            <button className="icon-btn absolute bottom-3 right-3 h-10 w-10 rounded-full bg-cozyGreen text-white hover:bg-cozyGreenHover lg:h-12 lg:w-12" aria-label="View The Mallee Hideaway">
              <Icon name="arrow-up-right" size={mobile ? 18 : 21} strokeWidth={1.8} />
            </button>
          </div>
          <div className={`flex items-baseline justify-between gap-2 ${mobile ? 'mt-2' : 'mt-3'}`}>
            <p className={`${mobile ? 'text-[12px]' : 'text-[clamp(12px,1vw,15px)]'} font-medium text-gray-700`}>The Mallee Hideaway</p>
            <p className={`${mobile ? 'text-[13px]' : 'text-[clamp(13px,1.05vw,16px)]'} whitespace-nowrap font-semibold text-cozyGreen`}>$149 AUD</p>
          </div>
        </div>
      );
    }

    function VideoCard({ mobile = false }) {
      return (
        <div className={`group relative overflow-hidden rounded-2xl soft-shadow ${mobile ? 'aspect-[3/4]' : 'aspect-[177/287]'}`}>
          <img src={ASSETS.video} alt="Pet product review" className="h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.035]" />
          <div className="absolute inset-0 bg-gradient-to-t from-black/65 via-black/5 to-transparent"></div>
          <div className={`absolute inset-x-0 bottom-0 flex flex-col items-center text-center ${mobile ? 'px-2 pb-3' : 'px-3 pb-4 lg:px-4 lg:pb-5'}`}>
            <button className={`icon-btn mb-2 rounded-full bg-cozyGreen text-white hover:bg-cozyGreenHover ${mobile ? 'h-9 w-9' : 'h-10 w-10 lg:h-12 lg:w-12'}`} aria-label="Play product reviews">
              <Icon name="play" size={mobile ? 16 : 18} strokeWidth={1.9} className="ml-0.5 fill-current" />
            </button>
            <p className={`${mobile ? 'text-[10px] leading-[1.25]' : 'text-[clamp(10px,.78vw,12px)] leading-[1.35]'} font-medium text-white`}>
              See what pet parents are loving, using, and reordering
            </p>
          </div>
        </div>
      );
    }

    function AvatarStat() {
      return (
        <div className="flex items-center gap-3 text-white animate-scale-in delay-1000">
          <div className="text-[clamp(28px,3.1vw,52px)] font-semibold leading-none tracking-[-0.04em]">12K+</div>
          <div className="flex -space-x-2">
            <img src={ASSETS.avatar} alt="Happy pet owner" className="h-9 w-9 rounded-full border-2 border-white object-cover lg:h-11 lg:w-11" />
            <span className="flex h-9 w-9 items-center justify-center rounded-full border-2 border-white bg-cozyGreen lg:h-11 lg:w-11">
              <Icon name="plus" size={17} strokeWidth={2} />
            </span>
          </div>
        </div>
      );
    }

    function RatingStat() {
      return (
        <div className="flex items-center gap-2 text-white animate-scale-in delay-1200">
          <span className="text-[clamp(28px,3.1vw,52px)] font-semibold leading-none tracking-[-0.04em]">4.9</span>
          <Icon name="star" size={34} strokeWidth={1.7} className="fill-[#C96A3D] text-[#C96A3D] lg:[&>svg]:h-10 lg:[&>svg]:w-10" />
        </div>
      );
    }

    function BottomPhotos({ tablet = false }) {
      return (
        <div className="absolute inset-x-0 bottom-0 z-10 flex items-end gap-0 overflow-hidden">
          <div className="relative flex flex-1 items-end overflow-hidden animate-photo-reveal delay-800" style={{ maxHeight: tablet ? '60vh' : 'min(70vh, 55vw)' }}>
            <img src={ASSETS.bottomLeft} alt="Happy pet lifestyle" className="bottom-photo" />
            <div className="overlay-gradient absolute inset-0"></div>
            <div className="absolute left-[clamp(16px,3vw,48px)]" style={{ bottom: 'clamp(20px, 4vh, 50px)' }}>
              <AvatarStat />
            </div>
          </div>

          <div className="relative flex flex-[1.265] items-end overflow-hidden animate-photo-reveal delay-600" style={{ maxHeight: tablet ? '75vh' : 'min(85vh, 70vw)' }}>
            <img src={ASSETS.bottomCenter} alt="Pet products collection" className="bottom-photo" />
            <div className="overlay-gradient absolute inset-0"></div>
            <div className="absolute inset-x-0 flex flex-col items-center px-5 text-center" style={{ bottom: 'clamp(20px, 4vh, 50px)' }}>
              <h2 className="animate-text-reveal delay-1000 max-w-[760px] text-[clamp(23px,3.25vw,54px)] font-semibold leading-[1.02] tracking-[-0.04em] text-white">
                Considered comfort. Chosen with care.
              </h2>
              <button className="animate-scale-in delay-1100 mt-3 inline-flex items-center gap-2 rounded-full bg-cozyOrange px-5 py-3 text-[12px] font-semibold text-white transition-all hover:-translate-y-0.5 hover:bg-cozyOrangeHover lg:mt-5 lg:px-7 lg:py-4 lg:text-sm">
                Shop The Collection
                <Icon name="arrow-right" size={17} strokeWidth={2} />
              </button>
            </div>
          </div>

          <div className="relative flex flex-1 items-end justify-end overflow-hidden animate-photo-reveal delay-900" style={{ maxHeight: tablet ? '60vh' : 'min(70vh, 55vw)' }}>
            <img src={ASSETS.bottomRight} alt="Pet enjoying Mallee & Paw products" className="bottom-photo" />
            <div className="overlay-gradient absolute inset-0"></div>
            <div className="absolute right-[clamp(16px,3vw,48px)]" style={{ bottom: 'clamp(20px, 4vh, 50px)' }}>
              <RatingStat />
            </div>
          </div>
        </div>
      );
    }

    function DesktopHero() {
      return (
        <div className="relative hidden h-full overflow-hidden lg:block">
          <div className="relative z-[5] px-12 pt-[5.4rem] text-center">
            <h1 className="font-serif-display text-[clamp(60px,7.5vw,110px)] leading-[0.95] tracking-[-0.045em] text-cozyGreen">
              <div className="overflow-visible">
                <span className="hero-word animate-word-pop delay-200">Better</span>
              </div>
              <div className="overflow-visible">
                <span className="hero-word animate-word-pop delay-300">Days</span>{' '}
                <span className="hero-word animate-word-pop delay-400">Start</span>{' '}
                <span className="hero-word animate-word-pop delay-500">Here</span>
              </div>
            </h1>
          </div>

          <div className="absolute left-12 top-[50px] z-20 w-[clamp(160px,14vw,260px)] animate-slide-in-left delay-600">
            <ProductCard />
          </div>

          <div className="absolute right-12 top-[50px] z-20 w-[clamp(120px,10vw,177px)] animate-slide-in-right delay-700">
            <VideoCard />
          </div>

          <BottomPhotos />
        </div>
      );
    }

    function TabletHero() {
      return (
        <div className="relative hidden h-full overflow-hidden md:block lg:hidden">
          <div className="relative z-[5] px-8 pt-[6rem] text-center">
            <h1 className="font-serif-display text-7xl leading-[0.94] tracking-[-0.045em] text-cozyGreen">
              <div><span className="hero-word animate-word-pop delay-200">Better</span></div>
              <div>
                <span className="hero-word animate-word-pop delay-300">Days</span>{' '}
                <span className="hero-word animate-word-pop delay-400">Start</span>{' '}
                <span className="hero-word animate-word-pop delay-500">Here</span>
              </div>
            </h1>
          </div>

          <div className="absolute left-4 top-[80px] z-20 w-[160px] animate-slide-in-left delay-600">
            <ProductCard />
          </div>

          <div className="absolute right-4 top-[80px] z-20 w-[120px] animate-slide-in-right delay-700">
            <VideoCard />
          </div>

          <BottomPhotos tablet />
        </div>
      );
    }

    function MobileBottomPhotos() {
      return (
        <div className="mt-auto flex min-h-0 flex-1 items-end overflow-hidden pt-2">
          <div className="flex w-full items-end gap-0">
            <div className="flex flex-1 items-end overflow-hidden animate-photo-reveal delay-800">
              <img src={ASSETS.bottomLeft} alt="Happy pet lifestyle" className="bottom-photo" />
            </div>
            <div className="flex flex-[1.265] items-end overflow-hidden animate-photo-reveal delay-600">
              <img src={ASSETS.bottomCenter} alt="Pet products collection" className="bottom-photo" />
            </div>
            <div className="flex flex-1 items-end overflow-hidden animate-photo-reveal delay-900">
              <img src={ASSETS.bottomRight} alt="Pet enjoying Mallee & Paw products" className="bottom-photo" />
            </div>
          </div>
        </div>
      );
    }

    function MobileHero() {
      return (
        <div className="flex h-full flex-col overflow-hidden px-4 md:hidden">
          <section className="shrink-0 text-center">
            <h1 className="font-serif-display text-[36px] leading-[0.95] tracking-[-0.035em] text-cozyGreen">
              <div>
                <span className="hero-word animate-word-pop delay-200">Better</span>
              </div>
              <div>
                <span className="hero-word animate-word-pop delay-300">Days</span>{' '}
                <span className="hero-word animate-word-pop delay-400">Start</span>{' '}
                <span className="hero-word animate-word-pop delay-500">Here</span>
              </div>
            </h1>
            <p className="mx-auto mt-2 max-w-[320px] animate-fade-up delay-600 text-[12px] leading-[1.45] text-gray-600">
              Premium pet essentials, chosen for comfort, play, and better days at home. Delivered Australia-wide.
            </p>
            <button className="animate-scale-in delay-700 mt-3 inline-flex items-center gap-2 rounded-full bg-cozyOrange px-5 py-2.5 text-[12px] font-semibold text-white transition-all hover:bg-cozyOrangeHover">
              Shop The Collection
              <Icon name="arrow-right" size={15} strokeWidth={2} />
            </button>
          </section>

          <section className="mt-4 grid shrink-0 grid-cols-2 gap-3">
            <div className="animate-slide-in-left delay-600"><ProductCard mobile /></div>
            <div className="animate-slide-in-right delay-700"><VideoCard mobile /></div>
          </section>

          <section className="mt-3 flex shrink-0 items-center justify-center animate-fade-up delay-1000">
            <div className="flex flex-1 items-center justify-center gap-2">
              <span className="text-2xl font-semibold leading-none tracking-[-0.04em] text-cozyGreen">12K+</span>
              <div className="flex -space-x-1.5">
                <img src={ASSETS.avatar} alt="Happy pet owner" className="h-8 w-8 rounded-full border-2 border-[#F3F5EC] object-cover" />
                <span className="flex h-8 w-8 items-center justify-center rounded-full border-2 border-[#F3F5EC] bg-cozyGreen text-white">
                  <Icon name="plus" size={14} strokeWidth={2} />
                </span>
              </div>
            </div>
            <div className="h-8 w-px bg-cozyGreen/20"></div>
            <div className="flex flex-1 items-center justify-center gap-1.5">
              <span className="text-2xl font-semibold leading-none tracking-[-0.04em] text-cozyGreen">4.9</span>
              <Icon name="star" size={22} strokeWidth={1.7} className="fill-[#C96A3D] text-[#C96A3D]" />
            </div>
          </section>

          <MobileBottomPhotos />
        </div>
      );
    }

    function App() {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      return (
        <main className="h-screen overflow-hidden bg-[#F3F5EC]">
          <div className="flex h-full flex-col overflow-hidden">
            <Header />
            <section className="flex flex-1 flex-col overflow-hidden">
              <DesktopHero />
              <TabletHero />
              <MobileHero />
            </section>
          </div>
        </main>
      );
    }
